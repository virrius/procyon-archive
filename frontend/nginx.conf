server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 30m;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  # campaign transfer: an archive with pictures weighs hundreds of MB and takes long to build and upload
  location = /api/admin/campaigns/import {
    client_max_body_size 4g;
    proxy_request_buffering off;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location /api/admin/transfers/ {
    proxy_buffering off;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }

  # rulebook pages and the sector map are for signed-in users only: book material is not served publicly
  # ^~: otherwise the static regex location below would serve .png/.jpg without the check
  location ^~ /media/ {
    auth_request /_session;
    expires 1d;
    add_header Cache-Control "private";
  }

  location = /_session {
    internal;
    proxy_pass http://api:8000/api/auth/session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
  }

  # index.html names the built assets: a cached copy after a deploy requests files
  # that are no longer in the image, and the table is stuck on the old version
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|jpg|svg)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
