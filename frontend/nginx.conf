server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 30m;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  # перенос кампании: архив с картинками весит сотни мегабайт, а собирается и льётся долго
  location = /api/admin/campaigns/import {
    client_max_body_size 4g;
    proxy_request_buffering off;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location /api/admin/transfers/ {
    proxy_buffering off;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }

  location /media/ {
    expires 1d;
    add_header Cache-Control "public";
  }

  # index.html держит имена собранных ассетов: закэшированный, он после деплоя
  # тянет файлы, которых в образе уже нет — стол сидит на старой версии
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|jpg|svg)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
