<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1c1a17"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#35302a" stroke-width="1.5"/>

  <g transform="translate(16 16)">
    <!-- внешнее кольцо врат: четыре сегмента с разрывами -->
    <circle r="12" fill="none" stroke="#8a6a2c" stroke-width="2.2"
            stroke-dasharray="14.2 4.6" transform="rotate(22.5)"/>
    <!-- спицы к внутреннему кольцу -->
    <g stroke="#8a6a2c" stroke-width="1.5" stroke-linecap="butt">
      <path d="M0 -11.6V-8.2M11.6 0H8.2M0 11.6V8.2M-11.6 0H-8.2"/>
    </g>
    <!-- среднее кольцо -->
    <circle r="7.6" fill="none" stroke="#d8a24a" stroke-width="2"
            stroke-dasharray="9.4 2.6"/>
    <!-- зрачок врат -->
    <circle r="4" fill="#f0bd6a"/>
    <path d="M-2.4 .9 3 -1.3" fill="none" stroke="#1c1a17" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
