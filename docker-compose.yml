services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: procyon
      POSTGRES_PASSWORD: procyon
      POSTGRES_DB: procyon
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procyon"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      additional_contexts:
        assets: ./assets
    environment:
      PA_DATABASE_URL: postgresql+psycopg://procyon:procyon@db:5432/procyon
      PA_JWT_SECRET: ${PA_JWT_SECRET:-}
      PA_UPLOAD_DIR: /data/uploads
      PA_WORKER_TOKEN: ${PA_WORKER_TOKEN:-}
      PA_ADMIN_PASSWORD: ${PA_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/data/uploads

  web:
    build:
      context: ./frontend
      additional_contexts:
        assets: ./assets
    depends_on:
      - api
    ports:
      - "7726:80"

volumes:
  db_data:
