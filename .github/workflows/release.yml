name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0. Empty: test images tagged edge, no release.'
        required: false

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - part: api
            context: backend
          - part: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.part }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=raw,value=edge,enable=${{ inputs.version == '' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-contexts: assets=assets
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}

  release:
    if: inputs.version != ''
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir procyon-archive
          cp release/docker-compose.yml INSTALL.md samples/demo-silence-over-brekk.zip procyon-archive/
          zip -r procyon-archive.zip procyon-archive
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" procyon-archive.zip --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
